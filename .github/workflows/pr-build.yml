name: PR Build APT Repository

# Builds the full signed APT repo and uploads it as a downloadable artifact,
# without deploying to GitHub Pages. Needs the GPG_PRIVATE_KEY secret, so it
# only runs for branches on this repo (not fork PRs).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  build:
    name: Build APT Repository (artifact only)
    uses: ./.github/workflows/build-repo.yml
    permissions:
      contents: read
    with:
      pages_artifact: false
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
