name: Update APT Repository

on:
  # Triggered by other repos after release
  repository_dispatch:
    types: [release-published]

  # Manual trigger with optional version overrides
  workflow_dispatch:
    inputs:
      odio_version:
        description: "go-odio-api version (e.g. v0.9.0) — leave empty to use latest"
        required: false
      discplayer_version:
        description: "go-mpd-discplayer version (e.g. v0.8.0) — leave empty to use latest"
        required: false
      spotifyd_version:
        description: "spotifyd version (e.g. v0.3.5) — leave empty to use latest"
        required: false
      mympd_version:
        description: "odio-mympd version (e.g. v25.0.1) — leave empty to use latest"
        required: false
      mpd2mpris_version:
        description: "mpd2mpris version (e.g. v0.11.1) — leave empty to use latest"
        required: false
      snapclientmpris_version:
        description: "snapclientmpris version (e.g. v1.1.0) — leave empty to use latest"
        required: false

  # Catch missed releases; twice weekly keeps the .deb cache warm (7-day TTL).
  schedule:
    - cron: "0 4 * * 1,4"  # Monday and Thursday 4am UTC

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-repo:
    name: Build APT Repository
    uses: ./.github/workflows/build-repo.yml
    permissions:
      contents: read
    with:
      odio_version: ${{ github.event.inputs.odio_version || '' }}
      discplayer_version: ${{ github.event.inputs.discplayer_version || '' }}
      spotifyd_version: ${{ github.event.inputs.spotifyd_version || '' }}
      mympd_version: ${{ github.event.inputs.mympd_version || '' }}
      mpd2mpris_version: ${{ github.event.inputs.mpd2mpris_version || '' }}
      snapclientmpris_version: ${{ github.event.inputs.snapclientmpris_version || '' }}
      pages_artifact: true
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build-repo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
