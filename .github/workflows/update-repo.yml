name: Update APT Repository

on:
  # Triggered by other repos after release
  repository_dispatch:
    types: [release-published]

  # Manual trigger with optional version overrides
  workflow_dispatch:
    inputs:
      odio_version:
        description: "go-odio-api version (e.g. v0.9.0) — leave empty to use latest"
        required: false
      discplayer_version:
        description: "go-mpd-discplayer version (e.g. v0.8.0) — leave empty to use latest"
        required: false
      spotifyd_version:
        description: "spotifyd version (e.g. v0.3.5) — leave empty to use latest"
        required: false
      mympd_version:
        description: "odio-mympd version (e.g. v25.0.1) — leave empty to use latest"
        required: false
      mpdris2_version:
        description: "mpDris2 version (e.g. v0.9.2) — leave empty to use latest"
        required: false
      snapclientmpris_version:
        description: "snapclientmpris version (e.g. v1.1.0) — leave empty to use latest"
        required: false

  # Rebuild nightly to catch any missed releases
  schedule:
    - cron: "0 4 * * 1"  # Monday 4am UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-repo:
    name: Build APT Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install reprepro
        run: sudo apt-get update && sudo apt-get install -y reprepro

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format long | grep sec | head -1 | awk '{print $2}' | cut -d'/' -f2)
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> "$GITHUB_ENV"

      - name: Configure reprepro
        run: |
          ./scripts/build-apt-repo.sh configure \
            --gpg-key-id "${GPG_KEY_ID}" \
            --basedir "${GITHUB_WORKSPACE}/repo"

      - name: Resolve versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/build-apt-repo.sh resolve \
            ${{ github.event.inputs.odio_version && format('--odio-version {0}', github.event.inputs.odio_version) || '' }} \
            ${{ github.event.inputs.discplayer_version && format('--discplayer-version {0}', github.event.inputs.discplayer_version) || '' }} \
            ${{ github.event.inputs.spotifyd_version && format('--spotifyd-version {0}', github.event.inputs.spotifyd_version) || '' }} \
            ${{ github.event.inputs.mympd_version && format('--mympd-version {0}', github.event.inputs.mympd_version) || '' }} \
            ${{ github.event.inputs.mpdris2_version && format('--mpdris2-version {0}', github.event.inputs.mpdris2_version) || '' }} \
            ${{ github.event.inputs.snapclientmpris_version && format('--snapclientmpris-version {0}', github.event.inputs.snapclientmpris_version) || '' }} \
            | tee -a "$GITHUB_ENV"

      - name: Download .deb packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/build-apt-repo.sh download

      - name: Build repository
        run: ./scripts/build-apt-repo.sh build --gpg-key-id "${GPG_KEY_ID}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo/

  deploy:
    name: Deploy to GitHub Pages
    needs: build-repo
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
